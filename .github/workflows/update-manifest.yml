---
name: Update Manifest

on:
  repository_dispatch:
    types: [new-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2.0.12)'
        required: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            VERSION="${{ github.event.client_payload.version }}"
          else
            VERSION="${{ inputs.version }}"
          fi
          VER="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"

      - name: Download .deb assets
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          VER: ${{ steps.meta.outputs.ver }}
        run: |
          curl -fSL -o amd64.deb \
            "https://github.com/kukaraf/ytmdesktop/releases/download/${VERSION}/youtube-music-desktop-app_${VER}_amd64.deb"
          curl -fSL -o arm64.deb \
            "https://github.com/kukaraf/ytmdesktop/releases/download/${VERSION}/youtube-music-desktop-app_${VER}_arm64.deb"

      - name: Compute sha512 hashes
        id: hashes
        run: |
          echo "amd64=$(sha512sum amd64.deb | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "arm64=$(sha512sum arm64.deb | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Update manifest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          VER: ${{ steps.meta.outputs.ver }}
          AMD64: ${{ steps.hashes.outputs.amd64 }}
          ARM64: ${{ steps.hashes.outputs.arm64 }}
        run: |
          python3 - <<'EOF'
          import os, re

          version = os.environ["VERSION"]
          ver = os.environ["VER"]
          amd64 = os.environ["AMD64"]
          arm64 = os.environ["ARM64"]

          with open("app.ytmdesktop.ytmdesktop.yml") as f:
              content = f.read()

          # Update amd64 URL
          content = re.sub(
              r'(releases/download/v)[^/]+(/youtube-music-desktop-app_)[^_]+(_amd64\.deb)',
              rf'releases/download/{version}/youtube-music-desktop-app_{ver}_amd64.deb',
              content,
          )
          # Update arm64 URL
          content = re.sub(
              r'(releases/download/v)[^/]+(/youtube-music-desktop-app_)[^_]+(_arm64\.deb)',
              rf'releases/download/{version}/youtube-music-desktop-app_{ver}_arm64.deb',
              content,
          )

          # Replace sha512 values in document order: amd64 entry appears first
          hashes = [amd64, arm64]
          idx = [0]
          def replace_hash(m):
              h = hashes[idx[0]]
              idx[0] += 1
              return f'sha512: {h}'
          content = re.sub(r'sha512: [0-9a-f]+', replace_hash, content)

          with open("app.ytmdesktop.ytmdesktop.yml", "w") as f:
              f.write(content)

          print(f"Updated manifest to {version}")
          print(f"  amd64: {amd64[:16]}...")
          print(f"  arm64: {arm64[:16]}...")
          EOF

      - name: Commit and push
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.ytmdesktop.ytmdesktop.yml
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update to ${VERSION}"
            git push
          fi
